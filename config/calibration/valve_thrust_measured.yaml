# 실측 기반 밸브 입력→추력 맵. 고정 공급압에서의 정적 특성.
# duty: 정규화 밸브 입력 (0..1); PLC 값 = int(duty * 4000).
# thrust_n: D00100..D00107 / thruster_geometry.yaml 순서의 8개 곡선 [N].
# 데드존 없이 선형 증가: 추력[N] = 0.5 * duty (8개 밸브 공통).
duty: [0.0, 1.0]
thrust_n:
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
  - [0.0, 0.5]
