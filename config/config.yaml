# Hydra 루트 설정 — 유일한 설정 소스(SSoT)
#
# 각 그룹 파일은 `# @package <노드명>` 지시자로 해당 노드의 ROS2 파라미터
# 서브트리에 병합된다. 런치가 fss_common.hydra_bridge로 이 트리를 컴포즈해
# 노드별 파라미터 YAML을 생성·로드한다.
#
# 오버라이드 예: python scripts/run_experiment.py gnc/controller=lqr gnc_node.translational.kp=8.0
defaults:
  - vehicle: mass_properties
  - hardware/plc
  - hardware/imu
  - hardware/vicon
  - hardware/arm
  - gnc/node
  - gnc/guidance: station_keep
  - gnc/controller: pid
  - gnc/navigator: ekf
  - gnc/allocator: thruster_allocation
  - system/manager
  - system/sim
  - system/sim_valve: real
  - scheduling: default
  - _self_
  # experiment는 위 그룹들을 override할 수 있도록 반드시 뒤에 위치
  - experiment: default

# config/ 기준 밸브 입력↔추력 맵. 빈 값이면 기존 선형 할당/추정 추력 0 유지.
valve_thrust_map_file: ""

# 시스템 전역 설정
system:
  use_sim: false          # true이면 SIL 모드 (하드웨어 없이 실행)
  use_arm: false          # 로봇팔 노드 실행
  use_thrusters: true     # 추력 출력 허용; false이면 GNC도 생략
  use_gnc: true           # 추력기 사용 시 본체 GNC 실행
  gnc_backend: cpp        # cpp: 기본 런타임, python: bindings를 사용하는 연구용 GNC
  log_level: INFO         # ROS2 로깅 레벨
